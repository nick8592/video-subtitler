<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240">
  <defs>
    <!-- Main gradient: dark warm charcoal -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b08"/>
      <stop offset="50%" stop-color="#1a1610"/>
      <stop offset="100%" stop-color="#0d0b08"/>
    </linearGradient>

    <!-- Gold accent gradient for text -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5af19"/>
      <stop offset="50%" stop-color="#f7cc5e"/>
      <stop offset="100%" stop-color="#f5af19"/>
    </linearGradient>

    <!-- Subtle shine on text -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop shadow with gold glow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#f5af19" flood-opacity="0.25"/>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#f5af19" opacity="0.04"/>
    </pattern>

    <!-- Horizontal line gradient -->
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#f5af19" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#e8890c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Radial glow behind title -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f5af19" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="240" rx="16" fill="url(#bg)"/>

  <!-- Dot pattern overlay -->
  <rect width="960" height="240" rx="16" fill="url(#dots)"/>

  <!-- Center glow -->
  <rect width="960" height="240" rx="16" fill="url(#center-glow)"/>

  <!-- Decorative geometric shapes -->
  <circle cx="140" cy="60" r="90" fill="#f5af19" opacity="0.02"/>
  <circle cx="820" cy="180" r="110" fill="#e8890c" opacity="0.02"/>

  <!-- Accent line top -->
  <rect x="60" y="50" width="840" height="1" fill="url(#line)" opacity="0.35"/>

  <!-- Main title -->
  <text x="480" y="122" text-anchor="middle" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="url(#accent)" filter="url(#shadow)" letter-spacing="-1">
    Video Subtitler
  </text>

  <!-- Shine overlay on title -->
  <text x="480" y="122" text-anchor="middle" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="url(#shine)" letter-spacing="-1">
    Video Subtitler
  </text>

  <!-- Subtitle line -->
  <text x="480" y="154" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#a08e6c" letter-spacing="3" opacity="0.8">
    AI-POWERED · WHISPER · GPU ACCELERATED
  </text>

  <!-- Accent line bottom -->
  <rect x="60" y="178" width="840" height="1" fill="url(#line)" opacity="0.35"/>

  <!-- Centered accent dots -->
  <circle cx="438" cy="178" r="2.5" fill="#f5af19" opacity="0.5"/>
  <circle cx="480" cy="178" r="2.5" fill="#f7cc5e" opacity="0.8"/>
  <circle cx="522" cy="178" r="2.5" fill="#f5af19" opacity="0.5"/>

  <!-- Border -->
  <rect width="960" height="240" rx="16" fill="none" stroke="#f5af19" stroke-opacity="0.08" stroke-width="1"/>
</svg>
