<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Subtitler — Signboard v4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;800&family=JetBrains+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #111;
  }

  .signboard {
    width: 960px;
    height: 240px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #0e0e0e;
  }

  /* Subtle noise texture */
  .signboard::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 56px;
    height: 100%;
  }

  .top-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #555;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .title {
    font-family: 'Inter', sans-serif;
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -2px;
    color: #f0f0f0;
    line-height: 1;
  }

  .title .thin {
    font-weight: 300;
    color: #888;
  }

  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #444;
    letter-spacing: 2px;
    margin-top: 14px;
  }

  /* Right side — minimal waveform */
  .waveform {
    position: absolute;
    right: 56px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0.12;
  }
  .waveform span {
    display: block;
    width: 2px;
    background: #fff;
    border-radius: 1px;
  }

  /* Thin separator line */
  .sep {
    position: absolute;
    bottom: 44px;
    left: 56px;
    right: 56px;
    height: 1px;
    background: linear-gradient(90deg, #333 0%, transparent 100%);
  }

  /* Bottom SRT preview */
  .srt-preview {
    position: absolute;
    bottom: 18px;
    left: 56px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #3a3a3a;
    letter-spacing: 0.5px;
  }

  .srt-preview .time {
    color: #555;
    margin-right: 12px;
  }
</style>
</head>
<body>
  <div class="signboard">
    <div class="content">
      <div class="top-label">Open Source Tool</div>
      <div class="title">Video <span class="thin">Subtitler</span></div>
      <div class="tagline">WHISPER · GPU · FFMPEG</div>
    </div>

    <div class="waveform">
      <span style="height:8px"></span><span style="height:16px"></span><span style="height:12px"></span><span style="height:24px"></span><span style="height:18px"></span><span style="height:32px"></span><span style="height:20px"></span><span style="height:40px"></span><span style="height:28px"></span><span style="height:14px"></span><span style="height:36px"></span><span style="height:22px"></span><span style="height:44px"></span><span style="height:16px"></span><span style="height:30px"></span><span style="height:38px"></span><span style="height:20px"></span><span style="height:10px"></span><span style="height:26px"></span><span style="height:34px"></span><span style="height:18px"></span><span style="height:22px"></span><span style="height:42px"></span><span style="height:14px"></span><span style="height:20px"></span><span style="height:28px"></span><span style="height:36px"></span><span style="height:12px"></span><span style="height:24px"></span>
    </div>

    <div class="sep"></div>
    <div class="srt-preview"><span class="time">00:00:01,200 → 00:00:05,200</span>yeah the cloud is climbing through the hill</div>
  </div>
</body>
</html>
